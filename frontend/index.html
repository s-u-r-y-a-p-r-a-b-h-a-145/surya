<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secure MFA Framework Demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      input, button { padding: .5rem; margin: .25rem 0; }
      .card { border: 1px solid #ddd; padding: 1rem; border-radius: .5rem; margin-bottom: 1rem; }
      img { max-width: 220px; }
      code { background: #f6f8fa; padding: 2px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Secure MFA Framework Demo</h1>
    <div class="card">
      <h2>Register</h2>
      <input id="reg-email" placeholder="email" />
      <input id="reg-pass" placeholder="password" type="password" />
      <button onclick="register()">Register</button>
      <pre id="reg-out"></pre>
    </div>

    <div class="card">
      <h2>Login</h2>
      <input id="log-email" placeholder="email" />
      <input id="log-pass" placeholder="password" type="password" />
      <button onclick="login()">Login</button>
      <div>Token: <code id="token"></code></div>
    </div>

    <div class="card">
      <h2>TOTP Setup</h2>
      <input id="user-id" placeholder="user id" />
      <button onclick="setupTotp()">Begin TOTP Setup</button>
      <div id="qr"></div>
      <pre id="totp-out"></pre>
    </div>

    <script>
      const API = 'http://localhost:8000';
      async function register(){
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-pass').value;
        const res = await fetch(API + '/auth/register', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password})});
        document.getElementById('reg-out').textContent = await res.text();
      }
      async function login(){
        const email = document.getElementById('log-email').value;
        const password = document.getElementById('log-pass').value;
        const res = await fetch(API + '/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password})});
        const data = await res.json();
        document.getElementById('token').textContent = data.access_token || 'failed';
      }
      async function setupTotp(){
        const userId = document.getElementById('user-id').value;
        const res = await fetch(API + '/totp/setup?user_id='+encodeURIComponent(userId), {method:'POST'});
        const data = await res.json();
        document.getElementById('totp-out').textContent = JSON.stringify(data, null, 2);
        const img = document.createElement('img');
        img.src = 'data:image/png;base64,' + data.qr_base64_png;
        const qrDiv = document.getElementById('qr');
        qrDiv.innerHTML = '';
        qrDiv.appendChild(img);
      }
    </script>
  </body>
</html>
