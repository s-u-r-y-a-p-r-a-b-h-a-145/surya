[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-mfa-framework"
version = "0.1.0"
dependencies = [
  "fastapi>=0.114",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "passlib[bcrypt]>=1.7",
  "pyjwt[crypto]>=2.9",
  "pyotp>=2.9",
  "qrcode[pil]>=7.4",
  "cryptography>=43.0",
  "webauthn>=2.0.0b1",
  "email-validator>=2.2"
]
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]
